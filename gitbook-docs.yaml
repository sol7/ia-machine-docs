$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: IAMachine
  structure:
    - type: section
      key: section-comecar
      title: Começar
      path: comecar
      default: true
      children:
        - type: space
          key: space-ia-machine
          title: Começar
          path: paginas-comecar
          default: true
          content:
            directory: ./comecar
            language: pt-br
    - type: section
      key: section-copilot
      title: IA Assistant
      path: assistant
      children:
        - type: space
          key: space-copilot
          title: IA Assistant
          path: paginas-copilot
          default: true
          content:
            directory: ./assistant
            language: pt-br
    - type: section
      key: section-trabalho
      title: IA Operations
      path: operations
      children:
        - type: space
          key: space-trabalho
          title: IA Operations
          path: paginas-trabalho
          default: true
          content:
            directory: ./operations
            language: pt-br
    - type: section
      key: section-referencia
      title: Referência
      path: referencia
      children:
        - type: space
          key: space-referencia
          title: Referência
          path: paginas-referencia
          default: true
          content:
            directory: ./referencia
            language: pt-br
